# Overlay on default.yaml: RLVR (GRPO) smoke for Nemotron 3 Nano 4B on the
# upstream math path (DAPOMath17K from HuggingFace; no data prep, no NeMo-Gym).
#
# NemotronH policies train on the Megatron backend, as in NeMo-RL's
# examples/nemo_gym/grpo_nanov3.yaml; the MoE knobs are the dense-model values
# from examples/configs/grpo_math_1B_megatron.yaml.
#
# Rollout, train, and validation batches are 448 so they split evenly across
# 32, 56, or 64 policy shards (4, 7, or 8 nodes of 8 GPUs). Keep
# cluster.num_nodes equal to the profile's `nodes`.
#
# Optional env: RL_POLICY_MODEL, RL_OUTPUT_DIR, WANDB_ENABLED, WANDB_NAME
#
#   nemotron steps run rl/nemo_rl/rlvr -c nano4b --batch lepton_nano4b_rl_a100

defaults: default.yaml

grpo:
  num_prompts_per_step: 56
  num_generations_per_prompt: 8
  max_num_steps: 5
  val_period: 5
  max_val_samples: 448
  val_batch_size: 448

policy:
  model_name: ${oc.env:RL_POLICY_MODEL,nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16}
  tokenizer:
    name: ${policy.model_name}
    # Reasoning off so answers fit in the short smoke generation budget.
    chat_template_kwargs:
      enable_thinking: false
  train_global_batch_size: 448
  train_micro_batch_size: 1
  generation_batch_size: 64
  logprob_batch_size: 1
  max_total_sequence_length: 2048
  dtensor_cfg:
    enabled: false
  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 1
    activation_checkpointing: false
    bias_activation_fusion: false
    tensor_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    context_parallel_size: 1
    pipeline_dtype: ${policy.precision}
    sequence_parallel: false
    freeze_moe_router: true
    moe_router_dtype: fp64
    moe_router_load_balancing_type: none
    moe_router_bias_update_rate: 0.0
    moe_permute_fusion: false
    moe_enable_deepep: false
    moe_token_dispatcher_type: alltoall
    moe_shared_expert_overlap: false
    moe_per_layer_logging: false
    apply_rope_fusion: true
    # Required whenever policy.logprob_chunk_size is set.
    defer_fp32_logits: true
    gradient_accumulation_fusion: false
    optimizer:
      optimizer: adam
      lr: 3.0e-6
      min_lr: 3.0e-6
      weight_decay: 0.0
      bf16: true
      fp16: false
      params_dtype: float32
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1.0e-8
      sgd_momentum: 0.9
      clip_grad: ${policy.max_grad_norm}
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0
    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: constant
      lr_decay_style: constant
      lr_decay_iters: null
      lr_warmup_iters: 10
      lr_warmup_init: 3.0e-7
    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: true
      overlap_param_gather: true
      average_in_collective: false
      use_custom_fsdp: false
      data_parallel_sharding_strategy: optim_grads_params
  sequence_packing:
    enabled: true
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: modified_first_fit_decreasing
    sequence_length_round: 64
  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}
  # Megatron owns the optimizer and scheduler; drop the DTensor ones.
  optimizer: null
  scheduler: null
  generation:
    max_new_tokens: 1024
    vllm_cfg:
      # Generation is colocated with training, so leave half of each GPU free.
      gpu_memory_utilization: 0.5
      # The math path calls the engine directly; no chat server or tool parser.
      expose_http_server: false
    vllm_kwargs:
      mamba_ssm_cache_dtype: float32

checkpointing:
  checkpoint_dir: ${oc.env:RL_OUTPUT_DIR,./output/rl}/rlvr-nano4b-checkpoints
  save_period: 5

logger:
  log_dir: ${oc.env:RL_OUTPUT_DIR,./output/rl}/rlvr-nano4b-logs
  wandb:
    name: ${oc.env:WANDB_NAME,rl-nemo-rl-rlvr-nano4b}

cluster:
  gpus_per_node: 8
  num_nodes: 7
