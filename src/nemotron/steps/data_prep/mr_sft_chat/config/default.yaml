# Vietnamese subset of Tiny Aya multilingual reasoning as chat JSONL for
# Nemotron 3 Nano 4B SFT / LoRA. Every row becomes two examples: Vietnamese
# (question, thinking, output) and its English original (original_* columns).
#
# Required env (env.toml profile or shell): MR_SFT_CHAT_DIR
#
#   nemotron steps run data_prep/mr_sft_chat --batch lepton_mr_sft_prep

dataset: CohereLabs/tiny-aya-l2-thinker-multilingual-reasoning
subset: vi
include_english: true

# Output file name -> dataset split. The dataset's test split is the held-out
# validation set; it is never packed into the training shards.
splits:
  train: train
  valid: test

# Examples longer than this, rendered with the tokenizer's chat template, are
# dropped. Keep it a little under the pack_size of data_prep/sft_packing: the
# packer cuts longer examples off, which removes the end of the answer.
tokenizer: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
max_tokens: 8160

# Row cap per split for smoke runs.
max_rows: null

output_dir: ${oc.env:MR_SFT_CHAT_DIR,./output/data_prep/mr_sft_chat/vi}
