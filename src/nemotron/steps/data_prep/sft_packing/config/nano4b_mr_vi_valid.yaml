# Overlay on nano4b_mr_vi.yaml: pack the held-out split of data_prep/mr_sft_chat
# into its own directory, used as packed_val_data_path by
# peft/megatron_bridge -c nano4b_mr_vi.
#
#   nemotron steps run data_prep/sft_packing -c nano4b_mr_vi_valid --batch lepton_mr_sft_prep

defaults: nano4b_mr_vi.yaml

run:
  env:
    env_vars:
      WANDB_NAME: ${oc.env:WANDB_NAME,data-prep-sft-packing-nano4b-mr-vi-valid}

blend_path: ${oc.env:MR_SFT_CHAT_DIR}/blend_valid.json
output_dir: ${oc.env:MR_SFT_PACKED_DIR}/valid
num_shards: 1
config_name: nano4b-mr-vi-valid
