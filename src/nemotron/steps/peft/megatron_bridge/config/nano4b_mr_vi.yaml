# Nemotron 3 Nano 4B LoRA on Tiny Aya multilingual reasoning: the Vietnamese
# subset plus its English originals, packed at 8k by
# `data_prep/sft_packing -c nano4b_mr_vi` (train) and `-c nano4b_mr_vi_valid`.
#
# Standalone rather than an overlay on default.yaml: the 4B recipe takes no
# arguments, so the recipe block must carry only `_target_`.
#
# Required env (env.toml profile or shell): MR_SFT_PACKED_DIR, MR_SFT_OUTPUT_DIR
# Optional: WANDB_PROJECT, WANDB_ENTITY, WANDB_NAME
#
#   nemotron steps run peft/megatron_bridge -c nano4b_mr_vi --batch lepton_nano4b_mr_lora

run:
  env:
    container_image: nvcr.io/nvidia/nemo:26.08
    env_vars:
      FLASHINFER_WORKSPACE_BASE: /nemo_run/cache/flashinfer_workspace
      FLASHINFER_CUBIN_DIR: /nemo_run/cache/flashinfer_cubins
      TRITON_CACHE_DIR: /tmp/triton_cache
      TORCHINDUCTOR_CACHE_DIR: /tmp/torchinductor_cache
      TILELANG_CACHE_DIR: /tmp/tilelang_cache
      TORCH_EXTENSIONS_DIR: /tmp/torch_extensions
      XDG_CACHE_HOME: /tmp/xdg_cache
    # Same Megatron-Bridge / Megatron-LM pins as lightning35.yaml; this
    # Megatron-Bridge revision carries the Nano 4B recipes, loads an HF
    # directory as the frozen PEFT base, and exports HF PEFT adapters.
    mounts:
      - ${auto_mount:git+https://github.com/NVIDIA-NeMo/Megatron-Bridge.git@0c565c9a063bc8578ec094b4eb488594ed8b033a,/opt/Megatron-Bridge}
      - ${auto_mount:git+https://github.com/NVIDIA/Megatron-LM.git@d12f6c8c9aff51e166d872fd70151687a8e3f375,/opt/Megatron-Bridge/3rdparty/Megatron-LM}

# The frozen base is the released HF checkpoint. The runner resolves this id to
# its local snapshot and hands it to Megatron-Bridge as
# checkpoint.pretrained_checkpoint, so no convert/hf_to_megatron run is needed.
hf_model_path: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
trust_remote_code: true

recipe:
  _target_: megatron.bridge.recipes.nemotronh.nemotron_3_nano_4b.nemotron_3_nano_4b_peft_config

# Nano 4B is a hybrid: 4 of its 42 layers are attention, the rest Mamba. The
# recipe default (attention only, rank 8) would adapt just those 4 layers, so
# the MLP and Mamba projections are adapted as well.
peft:
  type: lora
  dim: 16
  alpha: 32
  dropout: 0.0
  target_modules:
    - linear_qkv
    - linear_proj
    - linear_fc1
    - linear_fc2
    - in_proj
    - out_proj

dataset:
  seq_length: 8192
  packed_sequence_specs:
    packed_sequence_size: 8192
    packed_train_data_path: ${oc.env:MR_SFT_PACKED_DIR}/train/splits/train
    packed_val_data_path: ${oc.env:MR_SFT_PACKED_DIR}/valid/splits/train

# About 1,800 packed 8k sequences (9,062 examples), so 16 per step is roughly
# 110 steps per epoch: 330 steps is three epochs. TP=PP=CP=1, so DP equals the
# GPU count and global_batch_size must be a multiple of it.
train:
  train_iters: 330
  global_batch_size: 16
  micro_batch_size: 1

model:
  seq_length: 8192
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  context_parallel_size: 1

optimizer:
  lr: 1.0e-4
  min_lr: 0.0

scheduler:
  lr_warmup_iters: 15
  lr_decay_iters: 330

# Held-out loss twice per epoch; 12 x 16 covers the whole packed validation set.
validation:
  eval_interval: 55
  eval_iters: 12

# The frozen base comes from pretrained_checkpoint, so `load` must stay unset on
# a fresh run; set checkpoint.load to the adapter save directory to resume.
hf_load:
  clear_pretrained_checkpoint: false
  inherit_save_as_load: false

checkpoint_patch:
  # See default.yaml: avoids an EOFError while saving adapter checkpoints on
  # some remote filesystems.
  use_spawn_queue_for_torch_dist: true

logger:
  log_interval: 5
  wandb_project: ${oc.select:run.wandb.project,${oc.env:WANDB_PROJECT,null}}
  wandb_entity: ${oc.select:run.wandb.entity,${oc.env:WANDB_ENTITY,null}}
  wandb_exp_name: ${oc.env:WANDB_NAME,peft-megatron-bridge-nano4b-mr-vi}

checkpoint:
  save: ${oc.env:MR_SFT_OUTPUT_DIR}/lora-r16-8k
  pretrained_checkpoint: ${oc.env:MEGATRON_PRETRAIN_PATH,null}
  save_interval: 55
  finetune: true
  # Also write each adapter as an HF PEFT directory (adapter_config.json +
  # adapter_model.safetensors) next to the Megatron adapter checkpoint.
  also_save_hf_checkpoint: true
  fully_parallel_save: false
  async_save: false
  save_optim: false
  save_rng: false
